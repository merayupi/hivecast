[package]
name = "hivecast"
version = "0.1.0"
edition = "2021"
description = "HiveCast forecast-wagering contract (spec #1, ticket #2)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["unstable"] }
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing", "unstable"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
