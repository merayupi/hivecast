[package]
name = "hivecast"
version = "0.1.0"
edition = "2021"
description = "HiveCast forecast-wagering contract (spec #1, ticket #2)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.5.0", features = ["unstable"] }
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing", "unstable"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
# Official near-sandbox harness. Tests deploy the already-built release WASM
# artifact via `dev_deploy`, so the `unstable` (compile_project) feature is not
# needed. 0.24 ships near-jsonrpc-client 0.23 with protocol-88-compatible RPC
# types for near-sandbox 2.14.
near-workspaces = "0.24"
# Independent commitment-encoding primitives for the sandbox test.
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
