name: HiveCast Contract

on:
  workflow_dispatch:
  # Run automatically when the integration branch is pushed (workflow_dispatch
  # alone requires the workflow to already exist on the default branch, which
  # is not part of this repo's flow).
  push:
    branches:
      - integration/hivecast-spec-1
    paths:
      - 'contracts/**'
      - '.github/workflows/hivecast-contract.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/hivecast
          cache-on-failure: true

      - name: Build deployable WASM
        working-directory: contracts/hivecast
        run: RUSTFLAGS='-C link-arg=-s' cargo build --target wasm32-unknown-unknown --release

      # Compile every test target first so native sandbox type errors surface
      # even if the lib test body has an unrelated failure.
      - name: Compile all test targets (no-run)
        working-directory: contracts/hivecast
        run: cargo test --no-run

      - name: Run public-interface unit tests (near-sdk mock VM)
        working-directory: contracts/hivecast
        run: cargo test --lib

      - name: Run real near-sandbox lifecycle tests
        working-directory: contracts/hivecast
        run: cargo test --test sandbox -- --nocapture

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: hivecast.wasm
          path: contracts/hivecast/target/wasm32-unknown-unknown/release/hivecast.wasm
          if-no-files-found: error
