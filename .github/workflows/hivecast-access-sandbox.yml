name: HiveCast Access Sandbox

on:
  workflow_dispatch:
  push:
    branches:
      - integration/hivecast-spec-1
      - ticket/5-access
    paths:
      - 'packages/runner/**'
      - 'contracts/hivecast/**'
      - '.github/workflows/hivecast-access-sandbox.yml'

jobs:
  access-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build deployable contract WASM
        working-directory: contracts/hivecast
        run: RUSTFLAGS='-C link-arg=-s' cargo build --target wasm32-unknown-unknown --release

      - name: Install near-sandbox binary (Linux x86)
        run: |
          set -eux
          mkdir -p "$HOME/.near"
          curl -fsSL \
            "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.0.0/near-sandbox.tar.gz" \
            -o near-sandbox.tar.gz
          mkdir -p near-sandbox-extract
          tar -xzf near-sandbox.tar.gz -C near-sandbox-extract
          find near-sandbox-extract -type f -name 'near-sandbox*' -exec mv {} "$HOME/.near/near-sandbox-2.0.0" \; || true
          chmod +x "$HOME/.near/near-sandbox-2.0.0"
          "$HOME/.near/near-sandbox-2.0.0" --version || true

      - name: Run real near-sandbox Forecast Access proof
        working-directory: packages/runner
        env:
          HIVECAST_WASM: ../..//contracts/hivecast/target/wasm32-unknown-unknown/release/hivecast.wasm
          NEAR_SANDBOX_BIN_PATH: ${{ env.HOME }}/.near/near-sandbox-2.0.0
        run: npm run sandbox:access
