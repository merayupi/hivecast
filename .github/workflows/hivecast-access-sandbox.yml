name: HiveCast Access Sandbox

on:
  workflow_dispatch:
  push:
    branches:
      - integration/hivecast-spec-1
      - ticket/5-access
    paths:
      - 'packages/runner/**'
      - 'contracts/hivecast/**'
      - '.github/workflows/hivecast-access-sandbox.yml'

jobs:
  access-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build deployable contract WASM
        working-directory: contracts/hivecast
        run: RUSTFLAGS='-C link-arg=-s' cargo build --target wasm32-unknown-unknown --release

      - name: Install near-sandbox binary (Linux x86_64)
        run: |
          set -eux
          mkdir -p "$HOME/.near/near-sandbox-2.14.0-rc.5" /tmp/hc-sandbox-extract
          curl -fsSL \
            "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0-rc.5/near-sandbox.tar.gz" \
            -o /tmp/hc-sandbox.tar.gz
          tar -xzf /tmp/hc-sandbox.tar.gz -C /tmp/hc-sandbox-extract
          BIN="$(find /tmp/hc-sandbox-extract -type f -name 'near-sandbox' | head -n1)"
          test -n "$BIN"
          mv "$BIN" "$HOME/.near/near-sandbox-2.14.0-rc.5/near-sandbox"
          chmod +x "$HOME/.near/near-sandbox-2.14.0-rc.5/near-sandbox"
          "$HOME/.near/near-sandbox-2.14.0-rc.5/near-sandbox" --version || true
          # Export the expanded absolute path for the next step (env.HOME is not
          # set in GITHUB_ENV; shell $HOME is /home/runner).
          echo "NEAR_SANDBOX_BIN_PATH=$HOME/.near/near-sandbox-2.14.0-rc.5/near-sandbox" >> "$GITHUB_ENV"

      - name: Run real near-sandbox Forecast Access proof
        working-directory: packages/runner
        env:
          HIVECAST_WASM: ${{ github.workspace }}/contracts/hivecast/target/wasm32-unknown-unknown/release/hivecast.wasm
          NEAR_SANDBOX_BIN_PATH: ${{ env.NEAR_SANDBOX_BIN_PATH }}
        run: npm run sandbox:access

      - name: Run real near-sandbox Runner restart/recovery proof
        working-directory: packages/runner
        env:
          HIVECAST_WASM: ${{ github.workspace }}/contracts/hivecast/target/wasm32-unknown-unknown/release/hivecast.wasm
          NEAR_SANDBOX_BIN_PATH: ${{ env.NEAR_SANDBOX_BIN_PATH }}
        run: npm run sandbox:recovery

      - name: Run real near-sandbox source-boundary resolution proof
        working-directory: packages/runner
        env:
          HIVECAST_WASM: ${{ github.workspace }}/contracts/hivecast/target/wasm32-unknown-unknown/release/hivecast.wasm
          NEAR_SANDBOX_BIN_PATH: ${{ env.NEAR_SANDBOX_BIN_PATH }}
        run: npm run sandbox:source
